name: Build iOS App
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project FlappyBird.xcodeproj \
            -scheme FlappyBird \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r ./build/Build/Products/Release-iphoneos/FlappyBird.app ./Payload/
          zip -r FlappyBird.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-IPA
          path: FlappyBird.ipa