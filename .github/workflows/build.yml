name: Build iOS Test Game

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:

    runs-on: macos-15

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project FunTestGame.xcodeproj \
            -scheme FunTestGame \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/FunTestGame.app \
            Payload/FunTestGame.app

          zip -r FunTestGame.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FunTestGame-IPA
          path: FunTestGame.ipa
